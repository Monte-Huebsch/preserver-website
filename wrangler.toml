name = "preserver-me"
pages_build_output_dir = "."
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

# Vector index backing the site chatbot's knowledge base (homepage, FAQ,
# all 78 use-case cards, blog posts). Populated/refreshed by
# tools/chatbot/embed_and_upsert.py — see tools/chatbot/README.md.
[[vectorize]]
binding = "VECTORIZE"
index_name = "preserver-site-kb"

# Powers both the query embedding and the answer generation in
# functions/api/chat.js. Free tier: 10,000 neurons/day (Cloudflare account
# level), resets daily — see tools/chatbot/README.md for usage notes.
[ai]
binding = "AI"
